  <path d="M530 0c18 122-26 182 0 262 18 56 14 107-9 158M91 0v420" fill="none" stroke="#bbab93" stroke-width="13"/>
  <rect x="232" y="142" width="154" height="115" rx="9" fill="#b8c8a3"/>
  <g fill="#fffaf0" stroke="#4b5850" stroke-width="3">
    <rect x="162" y="53" width="145" height="71"/><rect x="328" y="53" width="127" height="71"/>
    <rect x="151" y="280" width="151" height="76"/><rect x="326" y="280" width="137" height="76"/>
  </g>
  <g font-family="sans-serif" fill="#26382f" text-anchor="middle" font-size="24">
    <text x="309" y="204" font-size="18">Binnenplaats</text>
    <text x="50" y="216" transform="rotate(-90 50 216)" font-size="19">Werfstraat</text>
    <text x="595" y="212" transform="rotate(-90 595 212)" font-size="19">Waterpad</text>
  </g>
  <text x="128" y="399" font-family="sans-serif" font-size="15" fill="#48574f">Situatietekening · niet op schaal</text>
</svg>
