<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Luwtewerf, schematische ligging</title>
  <desc id="desc">Vier woningen liggen rond de binnenplaats. Een waterpad ligt aan de oostzijde; de werfstraat aan de westzijde. De tekening is niet op schaal.</desc>
